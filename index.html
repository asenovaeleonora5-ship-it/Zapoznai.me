<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Запознай.me</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f4f8;
      color: #222;
    }

    header {
      background: #e91e63;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 25px;
      font-weight: bold;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    input, textarea, select {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      margin: 5px 3px;
      font-size: 15px;
      cursor: pointer;
      background: #e91e63;
      color: white;
    }

    button.secondary {
      background: #eee;
      color: #333;
    }

    button.like {
      background: #ff4081;
    }

    .hidden {
      display: none;
    }

    .user {
      border: 1px solid #eee;
      border-radius: 14px;
      padding: 15px;
      margin: 10px 0;
    }

    .user h3 {
      margin-top: 0;
    }

    .status {
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 12px;
      background: #f1f1f1;
    }

    .chat-box {
      height: 300px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 10px;
      background: #fafafa;
      margin-bottom: 10px;
    }

    .message {
      padding: 8px 12px;
      border-radius: 12px;
      margin: 6px 0;
      max-width: 80%;
      background: #eee;
    }

    .message.mine {
      margin-left: auto;
      background: #ffd1e0;
      text-align: right;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 15px;
    }

    .nav button {
      flex: 1;
      min-width: 100px;
    }

    .profile-name {
      font-size: 24px;
      font-weight: bold;
    }

    .small {
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>💕 Запознай.me</header>

<div class="container">

  <!-- LOGIN -->
  <div id="authSection" class="card">
    <h2>Добре дошли!</h2>

    <div id="loginBox">
      <h3>Вход</h3>

      <input id="loginEmail" type="email" placeholder="Имейл">
      <input id="loginPassword" type="password" placeholder="Парола">

      <button onclick="login()">Вход</button>
      <button class="secondary" onclick="showRegister()">Създай профил</button>
    </div>

    <div id="registerBox" class="hidden">
      <h3>Регистрация</h3>

      <input id="regName" placeholder="Име">
      <input id="regAge" type="number" placeholder="Възраст">
      <input id="regCity" placeholder="Град">

      <select id="regGender">
        <option value="">Пол</option>
        <option value="Жена">Жена</option>
        <option value="Мъж">Мъж</option>
      </select>

      <select id="regLooking">
        <option value="">Търся</option>
        <option value="Мъж">Мъж</option>
        <option value="Жена">Жена</option>
        <option value="Всички">Всички</option>
      </select>

      <textarea id="regDescription" placeholder="Разкажи нещо за себе си"></textarea>

      <input id="regEmail" type="email" placeholder="Имейл">
      <input id="regPassword" type="password" placeholder="Парола">
      <input id="regPassword2" type="password" placeholder="Повтори паролата">

      <button onclick="register()">Регистрация</button>
      <button class="secondary" onclick="showLogin()">Назад към вход</button>
    </div>

    <div id="authMessage" class="status"></div>
  </div>


  <!-- APP -->
  <div id="appSection" class="hidden">

    <div class="nav">
      <button onclick="showPage('home')">🏠 Начало</button>
      <button onclick="showPage('profile')">👤 Профил</button>
      <button onclick="showPage('likes')">❤️ Харесвания</button>
      <button onclick="showPage('friends')">👥 Приятели</button>
      <button onclick="showPage('chat')">💬 Чат</button>
      <button onclick="logout()">🚪 Изход</button>
    </div>


    <!-- HOME -->
    <div id="homePage" class="card">
      <h2>🔎 Потребители</h2>
      <div id="usersList">Зареждане...</div>
    </div>


    <!-- PROFILE -->
    <div id="profilePage" class="card hidden">
      <h2>👤 Моят профил</h2>

      <input id="editName" placeholder="Име">
      <input id="editAge" type="number" placeholder="Възраст">
      <input id="editCity" placeholder="Град">

      <select id="editGender">
        <option value="">Пол</option>
        <option value="Жена">Жена</option>
        <option value="Мъж">Мъж</option>
      </select>

      <select id="editLooking">
        <option value="">Търся</option>
        <option value="Мъж">Мъж</option>
        <option value="Жена">Жена</option>
        <option value="Всички">Всички</option>
      </select>

      <textarea id="editDescription" placeholder="Описание"></textarea>

      <button onclick="updateProfile()">💾 Запази промените</button>

      <div id="profileMessage" class="status"></div>
    </div>


    <!-- LIKES -->
    <div id="likesPage" class="card hidden">
      <h2>❤️ Харесвания</h2>
      <div id="likesList">Зареждане...</div>
    </div>


    <!-- FRIENDS -->
    <div id="friendsPage" class="card hidden">
      <h2>👥 Приятели</h2>

      <div id="friendsList">
        Засега можеш да добавяш потребители към приятели от техния профил.
      </div>
    </div>


    <!-- CHAT -->
    <div id="chatPage" class="card hidden">
      <h2>💬 Чат</h2>

      <div id="selectedUser" class="status">
        Избери потребител от Начало, за да започнеш чат.
      </div>

      <div id="chatBox" class="chat-box"></div>

      <div style="display:flex; gap:5px;">
        <input id="messageInput" placeholder="Напиши съобщение..." style="margin:0;">
        <button onclick="sendMessage()">Изпрати</button>
      </div>
    </div>

  </div>
</div>


<script>

const SUPABASE_URL = "https://shlwyiawfyyzyapcfmcu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable__XLJp2i5KQoRg03MeEs_VQ_9-mg5gLD";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

let currentUser = null;
let currentProfile = null;
let selectedUser = null;


/* AUTH */

function showRegister() {
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("registerBox").classList.remove("hidden");
}

function showLogin() {
  document.getElementById("registerBox").classList.add("hidden");
  document.getElementById("loginBox").classList.remove("hidden");
}

async function register() {

  const name = document.getElementById("regName").value.trim();
  const age = Number(document.getElementById("regAge").value);
  const city = document.getElementById("regCity").value.trim();
  const gender = document.getElementById("regGender").value;
  const looking = document.getElementById("regLooking").value;
  const description = document.getElementById("regDescription").value.trim();
  const email = document.getElementById("regEmail").value.trim();
  const password = document.getElementById("regPassword").value;
  const password2 = document.getElementById("regPassword2").value;

  if (!name || !age || !city || !gender || !looking || !email || !password) {
    showAuthMessage("Моля, попълни всички задължителни полета.");
    return;
  }

  if (password !== password2) {
    showAuthMessage("Паролите не съвпадат.");
    return;
  }

  const { data, error } = await supabaseClient.auth.signUp({
    email: email,
    password: password
  });

  if (error) {
    showAuthMessage(error.message);
    return;
  }

  if (!data.user) {
    showAuthMessage("Регистрацията не беше завършена.");
    return;
  }

  const { error: profileError } = await supabaseClient
    .from("profiles")
    .insert({
      id: data.user.id,
      name: name,
      age: age,
      city: city,
      gender: gender,
      looking_for: looking,
      description: description,
      email: email
    });

  if (profileError) {
    showAuthMessage("Потребителят е създаден, но профилът не можа да бъде записан: " + profileError.message);
    return;
  }

  showAuthMessage("Профилът е създаден успешно! ❤️");

  setTimeout(() => {
    loadApp(data.user);
  }, 1000);
}


async function login() {

  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    showAuthMessage(error.message);
    return;
  }

  loadApp(data.user);
}


async function logout() {

  await supabaseClient.auth.signOut();

  currentUser = null;
  currentProfile = null;

  document.getElementById("appSection").classList.add("hidden");
  document.getElementById("authSection").classList.remove("hidden");

  showLogin();
}


/* APP */

async function loadApp(user) {

  currentUser = user;

  document.getElementById("authSection").classList.add("hidden");
  document.getElementById("appSection").classList.remove("hidden");

  await loadMyProfile();
  await loadUsers();

  showPage("home");
}


async function loadMyProfile() {

  const { data, error } = await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id", currentUser.id)
    .single();

  if (error) {
    console.log(error);
    return;
  }

  currentProfile = data;

  document.getElementById("editName").value = data.name || "";
  document.getElementById("editAge").value = data.age || "";
  document.getElementById("editCity").value = data.city || "";
  document.getElementById("editGender").value = data.gender || "";
  document.getElementById("editLooking").value = data.looking_for || "";
  document.getElementById("editDescription").value = data.description || "";
}


async function updateProfile() {

  const updates = {
    name: document.getElementById("editName").value.trim(),
    age: Number(document.getElementById("editAge").value),
    city: document.getElementById("editCity").value.trim(),
    gender: document.getElementById("editGender").value,
    looking_for: document.getElementById("editLooking").value,
    description: document.getElementById("editDescription").value.trim()
  };

  const { error } = await supabaseClient
    .from("profiles")
    .update(updates)
    .eq("id", currentUser.id);

  const msg = document.getElementById("profileMessage");

  if (error) {
    msg.innerText = "Грешка: " + error.message;
    return;
  }

  msg.innerText = "Профилът е запазен успешно ❤️";
  await loadMyProfile();
}


/* USERS */

async function loadUsers() {

  const list = document.getElementById("usersList");

  const { data, error } = await supabaseClient
    .from("profiles")
    .select("*")
    .neq("id", currentUser.id)
    .order("created_at", { ascending: false });

  if (error) {
    list.innerHTML = "Грешка при зареждане: " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    list.innerHTML = "Все още няма други потребители.";
    return;
  }

  list.innerHTML = "";

  data.forEach(user => {

    const div = document.createElement("div");
    div.className = "user";

    div.innerHTML = `
      <div class="profile-name">${escapeHtml(user.name || "Без име")}</div>
      <div>${user.age ? user.age + " г." : ""} ${escapeHtml(user.city || "")}</div>
      <div class="small">${escapeHtml(user.gender || "")}</div>
      <p>${escapeHtml(user.description || "Няма описание.")}</p>

      <button class="like" onclick="likeUser('${user.id}')">
        ❤️ Харесай
      </button>

      <button onclick="startChat('${user.id}', '${escapeAttr(user.name || "Потребител")}')">
        💬 Чат
      </button>

      <button class="secondary" onclick="addFriend('${user.id}')">
        👥 Добави приятел
      </button>
    `;

    list.appendChild(div);
  });
}


/* LIKES */

async function likeUser(userId) {

  const { error } = await supabaseClient
    .from("likes")
    .insert({
      user_id: currentUser.id,
      liked_user_id: userId
    });

  if (error) {

    if (error.code === "23505") {
      alert("Вече си харесала този потребител ❤️");
    } else {
      alert("Грешка: " + error.message);
    }

    return;
  }

  alert("Хареса потребителя ❤️");
}


async function loadLikes() {

  const list = document.getElementById("likesList");

  const { data, error } = await supabaseClient
    .from("likes")
    .select("*")
    .eq("liked_user_id", currentUser.id);

  if (error) {
    list.innerHTML = "Грешка: " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    list.innerHTML = "Все още няма харесвания.";
    return;
  }

  list.innerHTML = "";

  for (const like of data) {

    const { data: profile } = await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id", like.user_id)
      .single();

    if (profile) {

      const div = document.createElement("div");
      div.className = "user";

      div.innerHTML = `
        <div class="profile-name">${escapeHtml(profile.name || "Потребител")}</div>
        <div>${profile.age || ""} г. ${escapeHtml(profile.city || "")}</div>
        <button onclick="startChat('${profile.id}', '${escapeAttr(profile.name || "Потребител")}')">
          💬 Пиши
        </button>
      `;

      list.appendChild(div);
    }
  }
}


/* FRIENDS */

async function addFriend(userId) {

  /*
    Ако все още нямаме таблица friends,
    запазваме действието локално за текущата версия.
  */

  let friends = JSON.parse(localStorage.getItem("zapoznai_friends_" + currentUser.id) || "[]");

  if (friends.includes(userId)) {
    alert("Този човек вече е добавен в приятели.");
    return;
  }

  friends.push(userId);

  localStorage.setItem(
    "zapoznai_friends_" + currentUser.id,
    JSON.stringify(friends)
  );

  alert("Добавен е в приятели 👥");

  await loadFriends();
}


async function loadFriends() {

  const list = document.getElementById("friendsList");

  let ids = JSON.parse(
    localStorage.getItem("zapoznai_friends_" + currentUser.id) || "[]"
  );

  if (ids.length === 0) {
    list.innerHTML = "Все още нямаш добавени приятели.";
    return;
  }

  list.innerHTML = "";

  for (const id of ids) {

    const { data: profile } = await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id", id)
      .single();

    if (profile) {

      const div = document.createElement("div");
      div.className = "user";

      div.innerHTML = `
        <div class="profile-name">${escapeHtml(profile.name || "Потребител")}</div>
        <div>${profile.age || ""} г. ${escapeHtml(profile.city || "")}</div>

        <button onclick="startChat('${profile.id}', '${escapeAttr(profile.name || "Потребител")}')">
          💬 Чат
        </button>
      `;

      list.appendChild(div);
    }
  }
}


/* CHAT */

async function startChat(userId, userName) {

  selectedUser = {
    id: userId,
    name: userName
  };

  document.getElementById("selectedUser").innerText =
    "💬 Чат с " + userName;

  showPage("chat");

  await loadMessages();
}


async function loadMessages() {

  if (!selectedUser) return;

  const box = document.getElementById("chatBox");

  const { data, error } = await supabaseClient
    .from("messages")
    .select("*")
    .or(
      `and(sender_id.eq.${currentUser.id},receiver_id.eq.${selectedUser.id}),and(sender_id.eq.${selectedUser.id},receiver_id.eq.${currentUser.id})`
    )
    .order("created_at", { ascending: true });

  if (error) {
    box.innerHTML = "Грешка при зареждане на чата: " + error.message;
    return;
  }

  box.innerHTML = "";

  (data || []).forEach(message => {

    const div = document.createElement("div");

    div.className =
      "message " +
      (message.sender_id === currentUser.id ? "mine" : "");

    div.innerText = message.content || "";

    box.appendChild(div);
  });

  box.scrollTop = box.scrollHeight;
}


async function sendMessage() {

  if (!selectedUser) {
    alert("Първо избери човек за чат.");
    return;
  }

  const input = document.getElementById("messageInput");
  const content = input.value.trim();

  if (!content) return;

  const { error } = await supabaseClient
    .from("messages")
    .insert({
      sender_id: currentUser.id,
      receiver_id: selectedUser.id,
      content: content
    });

  if (error) {
    alert("Грешка при изпращане: " + error.message);
    return;
  }

  input.value = "";

  await loadMessages();
}


/* NAVIGATION */

function showPage(page) {

  document.getElementById("homePage").classList.add("hidden");
  document.getElementById("profilePage").classList.add("hidden");
  document.getElementById("likesPage").classList.add("hidden");
  document.getElementById("friendsPage").classList.add("hidden");
  document.getElementById("chatPage").classList.add("hidden");

  if (page === "home") {
    document.getElementById("homePage").classList.remove("hidden");
    loadUsers();
  }

  if (page === "profile") {
    document.getElementById("profilePage").classList.remove("hidden");
    loadMyProfile();
  }

  if (page === "likes") {
    document.getElementById("likesPage").classList.remove("hidden");
    loadLikes();
  }

  if (page === "friends") {
    document.getElementById("friendsPage").classList.remove("hidden");
    loadFriends();
  }

  if (page === "chat") {
    document.getElementById("chatPage").classList.remove("hidden");
    loadMessages();
  }
}


/* HELPERS */

function showAuthMessage(message) {
  document.getElementById("authMessage").innerText = message;
}

function escapeHtml(text) {
  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeAttr(text) {
  return String(text)
    .replace(/'/g, "\\'")
    .replace(/"/g, "&quot;");
}


/* AUTO LOGIN */

supabaseClient.auth.getSession().then(({ data }) => {

  if (data.session) {
    loadApp(data.session.user);
  }

});

</script>

</body>
</html>
