  </div>

  <div id="content"></div>

  <button class="logout" onclick="logout()">🚪 Изход</button>

</div>

<script>

const SUPABASE_URL =
  "https://shlwyiawfyyzyapcfmcu.supabase.co";

const SUPABASE_KEY =
  "sb_publishable__XLJp2i5KQoRg03MeEs_VQ_9-mg5gLD";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let currentUser = null;
let currentChatUser = null;
let currentChatName = "";
let chatChannel = null;


// ========================================
// START
// ========================================

async function start() {

  const { data, error } =
    await supabaseClient.auth.getUser();

  if (error || !data.user) {

    document.getElementById("status").innerHTML =
      "Моля, влезте в профила си.";

    document.getElementById("content").innerHTML =
      '<div class="empty">Няма активен вход.</div>';

    return;
  }

  currentUser = data.user;

  await setOnline(true);

  document.getElementById("status").innerHTML =
    "Добре дошли! ❤️";

  showHome();
}


// ========================================
// ONLINE
// ========================================

async function setOnline(value) {

  if (!currentUser) return;

  await supabaseClient
    .from("profiles")
    .update({
      online: value,
      last_seen: new Date().toISOString()
    })
    .eq("id", currentUser.id);
}

window.addEventListener("beforeunload", () => {
  setOnline(false);
});


// ========================================
// HOME
// ========================================

async function showHome() {

  setActiveButton("homeBtn");

  const container =
    document.getElementById("content");

  container.innerHTML =
    '<div class="empty">Зареждане на профили...</div>';

  const profiles =
    await getOtherProfiles();

  renderProfiles(profiles, container);
}


// ========================================
// GET PROFILES
// ========================================

async function getOtherProfiles() {

  const { data, error } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .neq("id", currentUser.id)
      .order("name", { ascending: true });

  if (error) {

    console.log(error);

    return [];
  }

  const blocked = await getBlockedIds();

  return (data || []).filter(
    profile =>
      !blocked.includes(profile.id)
  );
}


// ========================================
// BLOCKED IDS
// ========================================

async function getBlockedIds() {

  const { data } =
    await supabaseClient
      .from("blocks")
      .select("blocked_user_id")
      .eq("user_id", currentUser.id);

  return (data || [])
    .map(x => x.blocked_user_id);
}


// ========================================
// RENDER PROFILES
// ========================================

function renderProfiles(profiles, container) {

  container.innerHTML = "";

  if (!profiles || profiles.length === 0) {

    container.innerHTML =
      '<div class="empty">Все още няма подходящи профили. ❤️</div>';

    return;
  }

  profiles.forEach(profile => {

    const card =
      document.createElement("div");

    card.className = "profile-card";

    const onlineText =
      profile.online
        ? '<span class="online">🟢 Онлайн</span>'
        : '<span class="offline">⚪ Не е онлайн</span>';

    card.innerHTML = `

      <div class="profile-top">

        <h2>
          ${escapeHtml(profile.name || "Потребител")}
        </h2>

        ${onlineText}

      </div>

      <div class="info">
        🎂 Възраст:
        ${escapeHtml(profile.age || "—")}
      </div>

      <div class="info">
        📍 Град:
        ${escapeHtml(profile.city || "—")}
      </div>

      <div class="info">
        👤 Пол:
        ${escapeHtml(profile.gender || "—")}
      </div>

      <div class="info">
        🔎 Търси:
        ${escapeHtml(profile.looking_for || "—")}
      </div>

      <div class="description">
        ${escapeHtml(
          profile.description ||
          "Няма описание."
        )}
      </div>

      <div class="buttons">

        <button
          class="like"
          onclick="likeUser('${profile.id}', this)">
          ❤️ Харесвам
        </button>

        <button
          class="friend"
          onclick="addFriend('${profile.id}', this)">
          👥 Приятел
        </button>

        <button
          class="chat"
          onclick="openChat('${profile.id}', ${jsString(profile.name || "Потребител")})">
          💬 Чат
        </button>

        <button
          class="block"
          onclick="blockUser('${profile.id}', ${jsString(profile.name || "Потребител")})">
          🚫 Блокирай
        </button>

      </div>
    `;

    container.appendChild(card);
  });
}


// ========================================
// LIKE
// ========================================

async function likeUser(userId, button) {

  if (!currentUser) return;

  const { error } =
    await supabaseClient
      .from("likes")
      .insert({
        user_id: currentUser.id,
        liked_user_id: userId
      });

  if (error) {

    if (error.code === "23505") {

      button.innerText = "❤️ Харесано";
      button.disabled = true;

      return;
    }

    console.log(error);

    alert("Грешка при харесването.");

    return;
  }

  button.innerText = "❤️ Харесано";
  button.disabled = true;
}


// ========================================
// FRIEND REQUEST
// ========================================

async function addFriend(userId, button) {

  if (!currentUser) return;

  const { data: existing } =
    await supabaseClient
      .from("friends")
      .select("*")
      .or(
        `and(user_id.eq.${currentUser.id},friend_id.eq.${userId}),and(user_id.eq.${userId},friend_id.eq.${currentUser.id})`
      )
      .maybeSingle();

  if (existing) {

    if (existing.status === "accepted") {
      button.innerText = "✓ Приятели";
    } else if (
      existing.user_id === currentUser.id
    ) {
      button.innerText = "✓ Изпратено";
    } else {
      button.innerText = "✓ Има заявка";
    }

    button.disabled = true;

    return;
  }

  const { error } =
    await supabaseClient
      .from("friends")
      .insert({
        user_id: currentUser.id,
        friend_id: userId,
        status: "pending"
      });

  if (error) {

    console.log(error);

    alert("Грешка при изпращането на заявката.");

    return;
  }

  button.innerText = "✓ Изпратено";
  button.disabled = true;
}


// ========================================
// SEARCH
// ========================================

async function showSearch() {

  setActiveButton("searchBtn");

  const container =
    document.getElementById("content");

  container.innerHTML = `

    <div class="search-box">

      <h2 class="search-title">
        🔎 Търсене на хора
      </h2>

      <input
        id="searchName"
        type="text"
        placeholder="Име..."
      >

      <input
        id="searchCity"
        type="text"
        placeholder="Град..."
      >

      <input
        id="searchMinAge"
        type="number"
        min="18"
        placeholder="Минимална възраст"
      >

      <input
        id="searchMaxAge"
        type="number"
        min="18"
        placeholder="Максимална възраст"
      >

      <button
        class="like"
        style="width:100%;color:white"
        onclick="performSearch()">
        🔎 Търси
      </button>

    </div>

    <div id="searchResults"></div>
  `;

  await performSearch();
}


// ========================================
// PERFORM SEARCH
// ========================================

async function performSearch() {

  const results =
    document.getElementById("searchResults");

  if (!results) return;

  results.innerHTML =
    '<div class="empty">Търсене...</div>';

  let profiles =
    await getOtherProfiles();

  const name =
    (document.getElementById("searchName")?.value || "")
      .trim()
      .toLowerCase();

  const city =
    (document.getElementById("searchCity")?.value || "")
      .trim()
      .toLowerCase();

  const minAge =
    parseInt(
      document.getElementById("searchMinAge")?.value
    );

  const maxAge =
    parseInt(
      document.getElementById("searchMaxAge")?.value
    );

  profiles =
    profiles.filter(profile => {

      const profileName =
        String(profile.name || "").toLowerCase();

      const profileCity =
        String(profile.city || "").toLowerCase();

      const age =
        parseInt(profile.age);

      if (
        name &&
        !profileName.includes(name)
      ) {
        return false;
      }

      if (
        city &&
        !profileCity.includes(city)
      ) {
        return false;
      }

      if (
        !isNaN(minAge) &&
        (!isNaN(age) && age < minAge)
      ) {
        return false;
      }

      if (
        !isNaN(maxAge) &&
        (!isNaN(age) && age > maxAge)
      ) {
        return false;
      }

      return true;
    });

  renderProfiles(profiles, results);
}

// ========================================
// FRIENDS
// ========================================

async function showFriends() {

  setActiveButton("friendsBtn");

  const container =
    document.getElementById("content");

  container.innerHTML =
    '<div class="empty">Зареждане...</div>';

  const { data, error } =
    await supabaseClient
      .from("friends")
      .select("*")
      .or(
        `user_id.eq.${currentUser.id},friend_id.eq.${currentUser.id}`
      );

  if (error) {

    console.log(error);

    container.innerHTML =
      '<div class="empty">Грешка при зареждане.</div>';

    return;
  }

  container.innerHTML =
    '<h2 style="color:#ff4f81">👥 Приятели</h2>';

  const requests =
    data.filter(
      x =>
        x.status === "pending" &&
        x.friend_id === currentUser.id
    );

  const accepted =
    data.filter(
      x =>
        x.status === "accepted"
    );

  if (requests.length > 0) {

    const title =
      document.createElement("h3");

    title.innerText =
      "📩 Получени заявки";

    container.appendChild(title);

    for (const request of requests) {

      const { data: profile } =
        await supabaseClient
          .from("profiles")
          .select("*")
          .eq("id", request.user_id)
          .maybeSingle();

      if (!profile) continue;

      const row =
        document.createElement("div");

      row.className = "friend-row";

      row.innerHTML = `

        <div>
          <strong>
            ${escapeHtml(profile.name || "Потребител")}
          </strong>
        </div>

        <div>

          <button
            style="background:#35b86b;color:white"
            onclick="acceptFriend(${request.id}, this)">
            ✓ Приеми
          </button>

          <button
            class="danger"
            onclick="rejectFriend(${request.id}, this)">
            ✕
          </button>

        </div>
      `;

      container.appendChild(row);
    }
  }

  if (accepted.length > 0) {

    const title =
      document.createElement("h3");

    title.innerText =
      "❤️ Моите приятели";

    container.appendChild(title);

    for (const friendship of accepted) {

      const friendId =
        friendship.user_id === currentUser.id
          ? friendship.friend_id
          : friendship.user_id;

      const { data: profile } =
        await supabaseClient
          .from("profiles")
          .select("*")
          .eq("id", friendId)
          .maybeSingle();

      if (!profile) continue;

      const row =
        document.createElement("div");

      row.className = "friend-row";

      row.innerHTML = `

        <div>
          <strong>
            ${escapeHtml(profile.name || "Потребител")}
          </strong>

          <br>

          ${escapeHtml(profile.city || "")}
        </div>

        <button
          class="chat"
          onclick="openChat('${profile.id}', ${jsString(profile.name || "Потребител")})">
          💬 Чат
        </button>

      `;

      container.appendChild(row);
    }
  }

  if (
    requests.length === 0 &&
    accepted.length === 0
  ) {

    container.innerHTML +=
      '<div class="empty">Все още нямате приятели или заявки. 👥</div>';
  }
}


// ========================================
// ACCEPT FRIEND
// ========================================

async function acceptFriend(id, button) {

  const { error } =
    await supabaseClient
      .from("friends")
      .update({
        status: "accepted"
      })
      .eq("id", id)
      .eq("friend_id", currentUser.id);

  if (error) {

    console.log(error);

    alert("Грешка при приемането.");

    return;
  }

  button.innerText = "✓ Прието";
  button.disabled = true;

  setTimeout(showFriends, 400);
}


// ========================================
// REJECT FRIEND
// ========================================

async function rejectFriend(id) {

  const { error } =
    await supabaseClient
      .from("friends")
      .delete()
      .eq("id", id)
      .eq("friend_id", currentUser.id);

  if (error) {

    console.log(error);

    alert("Грешка при отказването.");

    return;
  }

  showFriends();
}

async function showChats() {

  setActiveButton("chatsBtn");

  const container =
    document.getElementById("content");

  container.innerHTML =
    '<div class="empty">Зареждане на разговорите...</div>';

  const { data, error } =
    await supabaseClient
      .from("messages")
      .select("*")
      .or(
        `sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
      )
      .order("created_at", { ascending: false });

  if (error) {

    console.log(error);

    container.innerHTML =
      '<div class="empty">Грешка при зареждане на чатовете.</div>';

    return;
  }

  const users = new Map();

  (data || []).forEach(message => {

    const otherId =
      message.sender_id === currentUser.id
        ? message.receiver_id
        : message.sender_id;

    if (!users.has(otherId)) {
      users.set(otherId, message);
    }
  });

  container.innerHTML =
    '<h2 style="color:#ff4f81">💬 Моите чатове</h2>';

  if (users.size === 0) {

    container.innerHTML +=
      '<div class="empty">Все още нямате разговори.</div>';

    return;
  }

  for (const [userId, lastMessage] of users) {

    const { data: profile } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", userId)
        .maybeSingle();

    if (!profile) continue;

    const row =
      document.createElement("div");

    row.className = "friend-row";

    row.innerHTML = `

      <div style="flex:1">

        <strong>
          ${escapeHtml(profile.name || "Потребител")}
        </strong>

        <br>

        <span style="color:#777">
          ${escapeHtml(
            String(lastMessage.message || "").slice(0,60)
          )}
        </span>

      </div>

      <button
        class="chat"
        onclick="openChat('${profile.id}', ${jsString(profile.name || "Потребител")})">
        💬 Отвори
      </button>
    `;

    container.appendChild(row);
  }
}


// ========================================
// CHAT
// ========================================

async function openChat(userId, name) {

  currentChatUser = userId;
  currentChatName = name;

  if (chatChannel) {

    await supabaseClient
      .removeChannel(chatChannel);

    chatChannel = null;
  }

  const container =
    document.getElementById("content");

  container.innerHTML = `

    <div class="chat-box">

      <button
        class="back"
        onclick="showChats()">
        ← Назад към чатовете
      </button>

      <div class="chat-header">
        💬 Чат с ${escapeHtml(name)}
      </div>

      <div
        id="messages"
        class="messages">
        Зареждане...
      </div>

      <div class="send-box">

        <input
          id="messageInput"
          type="text"
          maxlength="1000"
          placeholder="Напишете съобщение..."
          onkeydown="
            if(event.key === 'Enter') {
              event.preventDefault();
              sendMessage();
            }
          "
        >

        <button onclick="sendMessage()">
          ➤
        </button>

      </div>

    </div>
  `;

  await loadMessages();

  subscribeToMessages();
}


// ========================================
// LOAD MESSAGES
// ========================================

async function loadMessages() {

  const messagesBox =
    document.getElementById("messages");

  if (!messagesBox) return;

  const { data, error } =
    await supabaseClient
      .from("messages")
      .select("*")
      .or(
        `and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentChatUser}),and(sender_id.eq.${currentChatUser},receiver_id.eq.${currentUser.id})`
      )
      .order(
        "created_at",
        { ascending: true }
      );

  if (error) {

    console.log(error);

    messagesBox.innerHTML =
      "Грешка при зареждане на съобщенията.";

    return;
  }

  messagesBox.innerHTML = "";

  if (!data || data.length === 0) {

    messagesBox.innerHTML =
      '<div class="empty">Все още няма съобщения.</div>';

    return;
  }

  data.forEach(addMessageToScreen);

  scrollMessages();
}


// ========================================
// SEND MESSAGE
// ========================================

async function sendMessage() {

  const input =
    document.getElementById("messageInput");

  if (!input) return;

  const message =
    input.value.trim();

  if (!message) return;

  const { data, error } =
    await supabaseClient
      .from("messages")
      .insert({
        sender_id: currentUser.id,
        receiver_id: currentChatUser,
        message: message
      })
      .select()
      .single();

  if (error) {

    console.log(error);

    alert(
      "Съобщението не може да бъде изпратено."
    );

    return;
  }

  input.value = "";

  if (data) {
    addMessageToScreen(data);
    scrollMessages();
  }
}


// ========================================
// REALTIME CHAT
// ========================================

function subscribeToMessages() {

  if (chatChannel) {

    supabaseClient
      .removeChannel(chatChannel);
  }

  chatChannel =
    supabaseClient
      .channel(
        "chat-" +
        currentUser.id +
        "-" +
        currentChatUser
      )
      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "messages"
        },
        payload => {

          const message =
            payload.new;

          if (
            message.sender_id === currentChatUser &&
            message.receiver_id === currentUser.id
          ) {

            addMessageToScreen(message);

            scrollMessages();
          }
        }
      )
      .subscribe();
}


// ========================================
// MESSAGE DISPLAY
// ========================================

function addMessageToScreen(message) {

  const box =
    document.getElementById("messages");

  if (!box) return;

  const empty =
    box.querySelector(".empty");

  if (empty) {
    empty.remove();
  }

  const div =
    document.createElement("div");

  div.className =
    "message " +
    (
      message.sender_id === currentUser.id
        ? "mine"
        : "theirs"
    );

  div.innerText =
    message.message;

  box.appendChild(div);
}

// ========================================
// SAVE PROFILE
// ========================================

async function saveProfile() {

  const name =
    document.getElementById("editName").value.trim();

  const age =
    document.getElementById("editAge").value.trim();

  const city =
    document.getElementById("editCity").value.trim();

  const gender =
    document.getElementById("editGender").value;

  const looking =
    document.getElementById("editLooking").value;

  const description =
    document.getElementById("editDescription").value.trim();

  if (!name) {

    alert("Моля, въведете име.");

    return;
  }

  const { error } =
    await supabaseClient
      .from("profiles")
      .update({
        name: name,
        age: age,
        city: city,
        gender: gender,
        looking_for: looking,
        description: description
      })
      .eq("id", currentUser.id);

  if (error) {

    console.log(error);

    alert(
      "Профилът не може да бъде запазен."
    );

    return;
  }

  alert("Профилът е обновен! ❤️");

  showMyProfile();
}

async function blockUser(userId, name) {

  const confirmBlock =
    confirm(
      "Да блокираме ли " +
      name +
      "?"
    );

  if (!confirmBlock) return;

  const { error } =
    await supabaseClient
      .from("blocks")
      .insert({
        user_id: currentUser.id,
        blocked_user_id: userId
      });

  if (error) {

    if (error.code === "23505") {

      alert("Този потребител вече е блокиран.");

      return;
    }

    console.log(error);

    alert("Грешка при блокирането.");

    return;
  }

  alert(
    name +
    " е блокиран."
  );

  showHome();
}

async function showNotifications() {

  setActiveButton("notificationsBtn");

  const container =
    document.getElementById("content");

  container.innerHTML =
    '<div class="empty">Зареждане...</div>';

  const [
    likesResult,
    friendsResult,
    messagesResult
  ] = await Promise.all([

    supabaseClient
      .from("likes")
      .select("user_id")
      .eq("liked_user_id", currentUser.id),

    supabaseClient
      .from("friends")
      .select("*")
      .eq("friend_id", currentUser.id)
      .eq("status", "pending"),

    supabaseClient
      .from("messages")
      .select("*")
      .eq("receiver_id", currentUser.id)
      .order("created_at", { ascending:false })
      .limit(20)

  ]);

  const likes =
    likesResult.data || [];

  const requests =
    friendsResult.data || [];

  const messages =
    messagesResult.data || [];

  container.innerHTML =
    '<h2 style="color:#ff4f81">🔔 Известия</h2>';

  if (
    likes.length === 0 &&
    requests.length === 0 &&
    messages.length === 0
  ) {

    container.innerHTML +=
      '<div class="empty">Няма нови известия. 🔔</div>';

    return;
  }

  if (likes.length > 0) {

    const notification =
      document.createElement("div");

    notification.className =
      "notification";

    notification.innerHTML = `
      ❤️ Имате
      <strong>${likes.length}</strong>
      ново/нови харесване/я.
      <br><br>
      <button
        class="like"
        style="color:white"
        onclick="showWhoLikedMe()">
        Виж кой ме е харесал
      </button>
    `;

    container.appendChild(notification);
  }

  if (requests.length > 0) {

    const notification =
      document.createElement("div");

    notification.className =
      "notification";

    notification.innerHTML = `
      👥 Имате
      <strong>${requests.length}</strong>
      нова/нови покана/и за приятелство.
      <br><br>
      <button
        class="friend"
        style="color:white"
        onclick="showFriends()">
        Виж поканите
      </button>
    `;

    container.appendChild(notification);
  }

  if (messages.length > 0) {

    const notification =
      document.createElement("div");

    notification.className =
      "notification";

    notification.innerHTML = `
      💬 Имате
      <strong>${messages.length}</strong>
      последни входящи съобщения.
      <br><br>
      <button
        class="chat"
        style="color:white"

function setActiveButton(id) {

  document
    .querySelectorAll(".menu button")
    .forEach(btn =>
      btn.classList.remove("active")
    );

  const button =
    document.getElementById(id);

  if (button) {
    button.classList.add("active");
  }
}

function scrollMessages() {

  if (box) {
    box.scrollTop =

  }
}

async function logout() {

  await setOnline(false);

  if (chatChannel) {
    await supabaseClient
      .removeChannel(chatChannel);
  }

  await supabaseClient.auth.signOut();

  window.location.reload();
}


// ========================================
// HTML SECURITY
// ========================================

function escapeHtml(value) {

  return String(value)

    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


// ========================================
// JAVASCRIPT STRING SECURITY
// ========================================

function jsString(value) {

  return JSON.stringify(
    String(value)
      .replaceAll("\\", "\\\\")
      .replaceAll("\n", " ")
      .replaceAll("\r", " ")
  );
}
