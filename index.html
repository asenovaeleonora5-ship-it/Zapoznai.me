<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Запознай.me</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffe6f0, #f5e6ff);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #d63384;
      font-size: 32px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
      color: #444;
    }

    input, select, textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      background: #fff;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #d63384;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #b82b70;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .profile {
      display: none;
      margin-top: 20px;
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    }

    .profile h2 {
      color: #d63384;
      margin-top: 0;
    }

    .profile p {
      margin: 10px 0;
      color: #444;
    }

    .logout {
      background: #777;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>💕 Запознай.me</h1>
  <div class="subtitle">Създай своя профил и се запознай с нови хора</div>

  <div class="card" id="registerCard">

    <h2>Създай профил</h2>

    <label>Име</label>
    <input type="text" id="name" placeholder="Твоето име">

    <label>Възраст</label>
    <input type="number" id="age" placeholder="Възраст">

    <label>Град</label>
    <input type="text" id="city" placeholder="Твоят град">

    <label>Пол</label>
    <select id="gender">
      <option value="">Избери</option>
      <option value="Жена">Жена</option>
      <option value="Мъж">Мъж</option>
    </select>

    <label>Кого търсиш?</label>
    <select id="looking_for">
      <option value="">Избери</option>
      <option value="Мъж">Мъж</option>
      <option value="Жена">Жена</option>
      <option value="Всички">Всички</option>
    </select>

    <label>За теб</label>
    <textarea id="description"
      placeholder="Напиши нещо за себе си..."></textarea>

    <label>Имейл</label>
    <input type="email" id="email" placeholder="example@email.com">

    <label>Парола</label>
    <input type="password" id="password" placeholder="Минимум 6 символа">

    <label>Потвърди паролата</label>
    <input type="password" id="confirmPassword" placeholder="Повтори паролата">

    <button onclick="register()">💕 Създай профил</button>

    <div class="message" id="message"></div>

  </div>

  <div class="profile" id="profile">

    <h2>💕 Твоят профил</h2>

    <p><strong>Име:</strong> <span id="pName"></span></p>
    <p><strong>Възраст:</strong> <span id="pAge"></span></p>
    <p><strong>Град:</strong> <span id="pCity"></span></p>
    <p><strong>Пол:</strong> <span id="pGender"></span></p>
    <p><strong>Търси:</strong> <span id="pLooking"></span></p>
    <p><strong>За мен:</strong> <span id="pDescription"></span></p>

    <button class="logout" onclick="logout()">Изход</button>

  </div>

</div>

<script>

const SUPABASE_URL =
  "https://shlwyiawfyyzyapcfmcu.supabase.co";

const SUPABASE_KEY =
  "sb_publishable__XLJp2i5KQoRg03MeEs_VQ_9-mg5gLD";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function register() {

  const name =
    document.getElementById("name").value.trim();

  const age =
    document.getElementById("age").value;

  const city =
    document.getElementById("city").value.trim();

  const gender =
    document.getElementById("gender").value;

  const looking_for =
    document.getElementById("looking_for").value;

  const description =
    document.getElementById("description").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;

  const message =
    document.getElementById("message");


  if (!name || !age || !city || !gender ||
      !looking_for || !email || !password) {

    message.style.color = "red";
    message.textContent =
      "Моля, попълни всички задължителни полета.";

    return;
  }


  if (password !== confirmPassword) {

    message.style.color = "red";
    message.textContent =
      "Паролите не съвпадат.";

    return;
  }


  if (password.length < 6) {

    message.style.color = "red";
    message.textContent =
      "Паролата трябва да е поне 6 символа.";

    return;
  }


  message.style.color = "#555";
  message.textContent = "Създавам профила...";


  const { data: authData, error: authError } =
    await supabaseClient.auth.signUp({
      email: email,
      password: password
    });


  if (authError) {

    message.style.color = "red";
    message.textContent =
      authError.message;

    return;
  }


  if (!authData.user) {

    message.style.color = "red";
    message.textContent =
      "Не успяхме да създадем потребителя.";

    return;
  }


  const { error: profileError } =
    await supabaseClient
      .from("profiles")
      .insert({

        id: authData.user.id,
        name: name,
        age: Number(age),
        city: city,
        gender: gender,
        looking_for: looking_for,
        description: description

      });


  if (profileError) {

    message.style.color = "red";
    message.textContent =
      "Потребителят е създаден, но профилът не беше записан: "
      + profileError.message;

    return;
  }


  message.style.color = "green";
  message.textContent =
    "💕 Профилът е създаден успешно!";


  showProfile({

    name: name,
    age: age,
    city: city,
    gender: gender,
    looking_for: looking_for,
    description: description

  });

}


function showProfile(profileData) {

  document.getElementById("registerCard").style.display =
    "none";

  document.getElementById("profile").style.display =
    "block";


  document.getElementById("pName").textContent =
    profileData.name;

  document.getElementById("pAge").textContent =
    profileData.age;

  document.getElementById("pCity").textContent =
    profileData.city;

  document.getElementById("pGender").textContent =
    profileData.gender;

  document.getElementById("pLooking").textContent =
    profileData.looking_for;

  document.getElementById("pDescription").textContent =
    profileData.description || "Няма добавено описание.";

}


async function logout() {

  await supabaseClient.auth.signOut();

  location.reload();

}


async function loadProfile() {

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();


  if (!user) {
    return;
  }


  const { data, error } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id", user.id)
      .single();


  if (error || !data) {
    return;
  }


  showProfile(data);

}


loadProfile();

</script>

</body>
</html>
