<!DOCTYPE html><html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Запознай.me</title>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f0f5;
      color: #333;
    }

    header {
      background: linear-gradient(135deg, #ff4f9a, #8e44ad);
      color: white;
      padding: 18px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 5px 0 0;
      opacity: .9;
    }

    .container {
      max-width: 700px;
      margin: 20px auto;
      padding: 0 15px 90px;
    }

    .welcome {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
      text-align: center;
    }

    .welcome h2 {
      margin-top: 0;
      color: #8e44ad;
    }

    .menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px 15px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
      cursor: pointer;
      transition: .2s;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    .icon {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .card h3 {
      margin: 5px 0;
      color: #8e44ad;
    }

    .card p {
      margin: 0;
      color: #777;
      font-size: 14px;
    }

    .logout {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #444;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      display: flex;
      justify-content: space-around;
      padding: 10px 5px;
      box-shadow: 0 -2px 10px rgba(0,0,0,.12);
    }

    .bottom button {
      border: 0;
      background: none;
      font-size: 13px;
      color: #555;
      cursor: pointer;
    }

    .bottom span {
      display: block;
      font-size: 24px;
    }

    @media (max-width: 450px) {
      .menu {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style></head><body><header>
  <h1>💗 Запознай.me</h1>
  <p>Нови хора. Нови приятелства. Нова любов.</p>
</header><div class="container">  <div class="welcome">
    <h2>Добре дошъл! ❤️</h2>
    <p id="welcomeText">Зареждаме твоя профил...</p>
  </div>  <div class="menu"><div class="card" onclick="openProfile()">
  <div class="icon">👤</div>
  <h3>Моят профил</h3>
  <p>Виж и редактирай профила си</p>
</div>

<div class="card" onclick="searchPeople()">
  <div class="icon">🔎</div>
  <h3>Търси хора</h3>
  <p>Открий нови хора</p>
</div>

<div class="card" onclick="showLikes()">
  <div class="icon">❤️</div>
  <h3>Харесвания</h3>
  <p>Кой те е харесал</p>
</div>

<div class="card" onclick="showFriends()">
  <div class="icon">👥</div>
  <h3>Приятели</h3>
  <p>Твоите приятели</p>
</div>

<div class="card" onclick="openChat()">
  <div class="icon">💬</div>
  <h3>Чат</h3>
  <p>Пиши на приятели</p>
</div>

<div class="card" onclick="showNotifications()">
  <div class="icon">🔔</div>
  <h3>Известия</h3>
  <p>Нови известия</p>
</div>

  </div><button class="logout" onclick="logout()">🚪 Изход</button>

</div><div class="bottom">
  <button onclick="goHome()">
    <span>🏠</span>Начало
  </button>  <button onclick="searchPeople()">
    <span>🔎</span>Търси
  </button>  <button onclick="openChat()">
    <span>💬</span>Чат
  </button>  <button onclick="openProfile()">
    <span>👤</span>Профил
  </button>
</div><script>

  const SUPABASE_URL = "https://shlwyiawfyyzyapcfmcu.supabase.co";
  const SUPABASE_KEY = "sb_publishable__XLJp2i5KQoRg03MeEs_VQ_9-mg5gLD";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  async function loadProfile() {

    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {
      document.getElementById("welcomeText").innerText =
        "Моля, влез в профила си.";
      return;
    }

    const { data, error } = await supabaseClient
      .from("profiles")
      .select("name")
      .eq("id", user.id)
      .maybeSingle();

    if (data && data.name) {
      document.getElementById("welcomeText").innerText =
        "Здравей, " + data.name + "! Радваме се, че си тук. ❤️";
    } else {
      document.getElementById("welcomeText").innerText =
        "Добре дошъл в Запознай.me! ❤️";
    }
  }

  function openProfile() {
    alert("👤 Раздел „Моят профил“ ще добавим следващ.");
  }

  function searchPeople() {
    alert("🔎 Раздел „Търси хора“ ще добавим следващ.");
  }

  function showLikes() {
    alert("❤️ Раздел „Харесвания“ ще добавим следващ.");
  }

  function showFriends() {
    alert("👥 Раздел „Приятели“ ще добавим следващ.");
  }

  function openChat() {
    alert("💬 Раздел „Чат“ ще добавим следващ.");
  }

  function showNotifications() {
    alert("🔔 Раздел „Известия“ ще добавим следващ.");
  }

  function goHome() {
    window.scrollTo(0, 0);
  }

  async function logout() {

    await supabaseClient.auth.signOut();

    alert("Излезе от профила.");

    location.reload();
  }

  loadProfile();

</script></body>
</html>
