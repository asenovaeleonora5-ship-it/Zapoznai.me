<!DOCTYPE html>
<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Запознай.me</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e7, #f8b6d2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    }

    h1 {
      text-align: center;
      color: #e83e8c;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 5px;
      font-weight: bold;
      color: #444;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #e83e8c;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>💕 Запознай.me</h1>

  <div class="subtitle">
    Създай своя профил
  </div>

  <form id="registerForm">

    <label>Име</label>
    <input type="text" id="name" placeholder="Твоето име" required>

    <label>Възраст</label>
    <input type="number" id="age" min="18" max="100" placeholder="Възраст" required>

    <label>Град</label>
    <input type="text" id="city" placeholder="Твоят град" required>

    <label>Пол</label>
    <select id="gender" required>
      <option value="">Избери</option>
      <option value="Жена">Жена</option>
      <option value="Мъж">Мъж</option>
      <option value="Друго">Друго</option>
    </select>

    <label>Кого търсиш?</label>
    <select id="looking_for" required>
      <option value="">Избери</option>
      <option value="Мъж">Мъж</option>
      <option value="Жена">Жена</option>
      <option value="Всеки">Всеки</option>
    </select>

    <label>За теб</label>
    <textarea id="description" placeholder="Напиши нещо за себе си..."></textarea>

    <label>Имейл</label>
    <input type="email" id="email" placeholder="example@email.com" required>

    <label>Парола</label>
    <input type="password" id="password" placeholder="Парола" required>

    <label>Потвърди паролата</label>
    <input type="password" id="confirmPassword" placeholder="Повтори паролата" required>

    <button type="submit">💕 Създай профил</button>

  </form>

  <div id="message"></div>

</div>

<script>

const SUPABASE_URL = "https://shlwyiawfyyzyapcfmcu.supabase.co";

const SUPABASE_KEY = "sb_publishable__XLJp2i5KQoRg03MeEs_VQ_9-mg5gLD";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

document.getElementById("registerForm").addEventListener("submit", async function(event) {

  event.preventDefault();

  const message = document.getElementById("message");

  const name = document.getElementById("name").value.trim();
  const age = parseInt(document.getElementById("age").value);
  const city = document.getElementById("city").value.trim();
  const gender = document.getElementById("gender").value;
  const looking_for = document.getElementById("looking_for").value;
  const description = document.getElementById("description").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (password !== confirmPassword) {
    message.style.color = "red";
    message.textContent = "❌ Паролите не съвпадат.";
    return;
  }

  if (password.length < 6) {
    message.style.color = "red";
    message.textContent = "❌ Паролата трябва да е поне 6 символа.";
    return;
  }

  message.style.color = "#555";
  message.textContent = "⏳ Създаваме профила...";

  try {

    const { data: authData, error: authError } =
      await supabaseClient.auth.signUp({
        email: email,
        password: password
      });

    if (authError) {
      throw authError;
    }

    if (!authData.user) {
      throw new Error("Профилът не беше създаден.");
    }

    const { error: profileError } =
      await supabaseClient
        .from("profiles")
        .insert([
          {
            id: authData.user.id,
            name: name,
            age: age,
            city: city,
            gender: gender,
            looking_for: looking_for,
            description: description,
            email: email
          }
        ]);

    if (profileError) {
      throw profileError;
    }

    message.style.color = "green";

    message.innerHTML =
      "💕 Добре дошла, " +
      name +
      "!<br><br>Профилът ти е създаден успешно.";

    document.getElementById("registerForm").reset();

  } catch (error) {

    console.error(error);

    message.style.color = "red";
    message.textContent = "❌ " + error.message;
  }

});

</script>

</body>
</html>
