<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Запознай.me</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff5f9e, #8e44ad);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
    }

    h1 {
      text-align: center;
      color: #e83e8c;
      margin-top: 0;
    }

    h2 {
      text-align: center;
      color: #555;
    }

    input, select, textarea, button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 16px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      background: #e83e8c;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #d63384;
    }

    .hidden {
      display: none;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }

    .profile {
      text-align: center;
    }

    .profile-card {
      background: #fff0f6;
      padding: 20px;
      border-radius: 15px;
      margin-top: 20px;
    }

    .logout {
      background: #555;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>💕 Запознай.me</h1>

  <!-- РЕГИСТРАЦИЯ -->
  <div id="registerBox">

    <h2>Създай профил</h2>

    <input id="name" type="text" placeholder="Име">

    <input id="age" type="number" placeholder="Възраст" min="18">

    <input id="city" type="text" placeholder="Град">

    <select id="gender">
      <option value="">Пол</option>
      <option value="Жена">Жена</option>
      <option value="Мъж">Мъж</option>
      <option value="Друго">Друго</option>
    </select>

    <select id="looking_for">
      <option value="">Кого търсиш?</option>
      <option value="Мъж">Мъж</option>
      <option value="Жена">Жена</option>
      <option value="Всички">Всички</option>
    </select>

    <textarea id="description"
      placeholder="Разкажи малко за себе си..."></textarea>

    <input id="email" type="email" placeholder="Имейл">

    <input id="password" type="password" placeholder="Парола">

    <input id="confirmPassword" type="password"
      placeholder="Повтори паролата">

    <button onclick="register()">Регистрация</button>

    <div id="message" class="message"></div>

  </div>


  <!-- ПРОФИЛ -->
  <div id="profileBox" class="hidden profile">

    <h2>💕 Твоят профил</h2>

    <div class="profile-card">

      <h2 id="profileName"></h2>

      <p id="profileInfo"></p>

      <p id="profileDescription"></p>

    </div>

    <button class="logout" onclick="logout()">Изход</button>

  </div>

</div>


<script>

  // SUPABASE
  const SUPABASE_URL =
    "https://shlwyiawfyyzyapcfmcu.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable__XLJp2i5KQoRg03MeEs_VQ_9-mg5gLD";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // РЕГИСТРАЦИЯ
  async function register() {

    const name =
      document.getElementById("name").value.trim();

    const age =
      document.getElementById("age").value;

    const city =
      document.getElementById("city").value.trim();

    const gender =
      document.getElementById("gender").value;

    const looking_for =
      document.getElementById("looking_for").value;

    const description =
      document.getElementById("description").value.trim();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;

    const message =
      document.getElementById("message");


    // ПРОВЕРКИ

    if (
      !name ||
      !age ||
      !city ||
      !gender ||
      !looking_for ||
      !email ||
      !password
    ) {
      message.className = "message error";
      message.innerText =
        "Моля, попълни всички задължителни полета.";
      return;
    }


    if (Number(age) < 18) {
      message.className = "message error";
      message.innerText =
        "Регистрацията е само за лица над 18 години.";
      return;
    }


    if (password !== confirmPassword) {
      message.className = "message error";
      message.innerText =
        "Паролите не съвпадат.";
      return;
    }


    if (password.length < 6) {
      message.className = "message error";
      message.innerText =
        "Паролата трябва да е поне 6 символа.";
      return;
    }


    message.className = "message";
    message.innerText =
      "Създаваме профила...";


    // СЪЗДАВАНЕ НА USER
    const {
      data: authData,
      error: authError
    } = await supabaseClient.auth.signUp({
      email: email,
      password: password
    });


    if (authError) {

      message.className = "message error";

      message.innerText =
        authError.message;

      return;
    }


    if (!authData.user) {

      message.className = "message error";

      message.innerText =
        "Потребителят не беше създаден.";

      return;
    }


    // ЗАПИСВАНЕ В PROFILES
    const {
      error: profileError
    } = await supabaseClient
      .from("profiles")
      .insert({

        id: authData.user.id,

        name: name,

        age: Number(age),

        city: city,

        gender: gender,

        looking_for: looking_for,

        description: description,

        email: email

      });


    if (profileError) {

      console.error(profileError);

      message.className =
        "message error";

      message.innerText =
        "Потребителят е създаден, но профилът не беше записан: "
        + profileError.message;

      return;
    }


    // УСПЕШНО
    message.className =
      "message success";

    message.innerText =
      "Профилът е създаден успешно! ❤️";


    setTimeout(() => {
      showProfile({
        name,
        age,
        city,
        gender,
        looking_for,
        description
      });
    }, 1000);

  }


  // ПОКАЗВАНЕ НА ПРОФИЛА
  function showProfile(profile) {

    document
      .getElementById("registerBox")
      .classList.add("hidden");

    document
      .getElementById("profileBox")
      .classList.remove("hidden");


    document.getElementById("profileName")
      .innerText =
      profile.name;


    document.getElementById("profileInfo")
      .innerText =
      profile.age +
      " г. • " +
      profile.city +
      " • " +
      profile.gender;


    document.getElementById("profileDescription")
      .innerText =
      profile.description ||
      "Все още няма описание.";
  }


  // ПРОВЕРКА ПРИ ОТВАРЯНЕ
  async function checkUser() {

    const {
      data
    } = await supabaseClient.auth.getUser();


    if (!data.user) {
      return;
    }


    const {
      data: profile,
      error
    } = await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id", data.user.id)
      .single();


    if (!error && profile) {

      showProfile(profile);

    }

  }


  // ИЗХОД
  async function logout() {

    await supabaseClient.auth.signOut();

    location.reload();

  }


  checkUser();

</script>

</body>
</html>
