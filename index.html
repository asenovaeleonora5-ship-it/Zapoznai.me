<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Запознай.me</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #ff4f81;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 15px;
    }

    .profile-card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .profile-card h2 {
      margin-top: 0;
      color: #ff4f81;
    }

    .info {
      margin: 7px 0;
    }

    .description {
      margin-top: 15px;
      padding: 12px;
      background: #f8f8f8;
      border-radius: 10px;
    }

    .buttons {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    button {
      flex: 1;
      border: none;
      padding: 12px 8px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      color: white;
    }

    .like {
      background: #ff4f81;
    }

    .friend {
      background: #4b8df8;
    }

    .chat {
      background: #35b86b;
    }

    button:hover {
      opacity: .85;
    }

    #status {
      text-align: center;
      margin: 15px 0;
      font-weight: bold;
    }

    .logout {
      background: #333;
      margin-top: 15px;
      width: 100%;
    }

    .empty {
      background: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
    }
  </style>
</head>

<body>

<header>
  <h1>❤️ Запознай.me</h1>
  <div>Нови хора • Приятелства • Любов</div>
</header>

<div class="container">

  <div id="status">Зареждане...</div>

  <div id="profiles"></div>

  <button class="logout" onclick="logout()">Изход</button>

</div>

<script>
  const SUPABASE_URL = "https://shlwyiawfyyzyapcfmcu.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable__XLJp2i5KQoRg03MeEs_VQ_9-mg5gLD";

  const supabaseClient =
    window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentUser = null;

  async function start() {
    const { data, error } =
      await supabaseClient.auth.getUser();

    if (error || !data.user) {
      document.getElementById("status").innerHTML =
        "Моля, влезте в профила си.";
      return;
    }

    currentUser = data.user;

    document.getElementById("status").innerHTML =
      "Добре дошли! ❤️";

    loadProfiles();
  }

  async function loadProfiles() {

    const { data, error } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .neq("id", currentUser.id);

    if (error) {
      console.log(error);

      document.getElementById("profiles").innerHTML =
        '<div class="empty">Грешка при зареждане на профилите.</div>';

      return;
    }

    const container =
      document.getElementById("profiles");

    container.innerHTML = "";

    if (!data || data.length === 0) {
      container.innerHTML =
        '<div class="empty">Все още няма други профили. ❤️</div>';

      return;
    }

    data.forEach(profile => {

      const card =
        document.createElement("div");

      card.className = "profile-card";

      card.innerHTML = `
        <h2>${escapeHtml(profile.name || "Потребител")}</h2>

        <div class="info">
          🎂 Възраст:
          ${escapeHtml(profile.age || "—")}
        </div>

        <div class="info">
          📍 Град:
          ${escapeHtml(profile.city || "—")}
        </div>

        <div class="info">
          👤 Пол:
          ${escapeHtml(profile.gender || "—")}
        </div>

        <div class="info">
          🔎 Търси:
          ${escapeHtml(profile.looking_for || "—")}
        </div>

        <div class="description">
          ${escapeHtml(profile.description || "Няма описание.")}
        </div>

        <div class="buttons">

          <button
            class="like"
            onclick="likeUser('${profile.id}', this)">
            ❤️ Харесвам
          </button>

          <button
            class="friend"
            onclick="addFriend('${profile.id}', this)">
            👥 Приятел
          </button>

          <button
            class="chat"
            onclick="openChat('${profile.id}')">
            💬 Чат
          </button>

        </div>
      `;

      container.appendChild(card);
    });
  }

  async function likeUser(userId, button) {

    if (!currentUser) return;

    const { error } =
      await supabaseClient
        .from("likes")
        .insert({
          user_id: currentUser.id,
          liked_user_id: userId
        });

    if (error) {

      if (error.code === "23505") {
        button.innerText = "❤️ Харесано";
        return;
      }

      alert("Грешка при харесването.");
      console.log(error);
      return;
    }

    button.innerText = "❤️ Харесано";
    button.disabled = true;
  }

  async function addFriend(userId, button) {

    if (!currentUser) return;

    /*
      Ако все още нямаш таблица friends,
      временно показваме съобщение.
      След това ще направим истинската система
      за приятелски заявки.
    */

    alert("Изпратена е заявка за приятелство! 👥");

    button.innerText = "✓ Изпратено";
    button.disabled = true;
  }

  function openChat(userId) {

    alert(
      "Чатът с този потребител ще бъде отворен тук. 💬"
    );

    /*
      Следващата стъпка ще бъде истинският чат
      със съобщения в таблицата messages.
    */
  }

  async function logout() {

    await supabaseClient.auth.signOut();

    window.location.reload();
  }

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  start();
</script>

</body>
</html>
